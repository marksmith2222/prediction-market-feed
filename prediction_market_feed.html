<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prediction Market Real Time Feed</title>
<style>body{font:15px system-ui;background:#101827;color:#f3f6fb;margin:0;padding:18px}main{max-width:1100px;margin:auto}h1{font-size:24px}section{background:#1d2a3e;padding:16px;border-radius:12px;margin:12px 0}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{display:block;font-size:13px;color:#c4d0e0}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border-radius:7px;border:1px solid #53647c;background:#111c2e;color:white}button{background:#3275ed;border:0;font-weight:700;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #40506a;padding:9px}th{color:#bdd0e9}.scroll{overflow-x:auto}.muted{color:#afbed2}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Prediction Market Real Time Feed</h1><p class="muted">Large-trade monitor • Data appears only when a connected API returns trades.</p>
<section class="filters"><label>Platform<select id="platform"><option value="all">Both</option><option value="polymarket">Polymarket</option><option value="kalshi">Kalshi</option></select></label><label>Min trade ($)<input id="minAmount" type="number" min="0" value="500" step="100"></label><label>Max trade ($, blank = no max)<input id="maxAmount" type="number" min="0" placeholder="No maximum"></label><label>Min price ($)<input id="minPrice" type="number" min="0" max="1" step="0.01" value="0.10"></label><label>Max price ($)<input id="maxPrice" type="number" min="0" max="1" step="0.01" value="0.90"></label><label>Side<select id="side"><option value="all">YES and NO</option><option value="yes">YES</option><option value="no">NO</option></select></label><label>Group<select id="group"><option value="time">Newest first</option><option value="event">By event</option></select></label><label>API endpoint<input id="api" placeholder="https://your-worker.workers.dev"></label></section>
<section><button id="refresh">Refresh trades</button><p id="status" class="muted">Enter your deployed Cloudflare Worker URL to load trades. No sample trades are shown.</p></section>
<section class="scroll"><table><thead><tr><th>Time</th><th>Platform</th><th>Event</th><th>Side</th><th>Price</th><th>Amount</th></tr></thead><tbody id="results"><tr><td colspan="6">No trades loaded yet.</td></tr></tbody></table></section>
</main><script>
const ids=['platform','minAmount','maxAmount','minPrice','maxPrice','side','group','api'];const $=id=>document.getElementById(id);
for(const id of ids){const saved=localStorage.getItem('pmfeed_'+id);if(saved!==null)$(id).value=saved;$(id).addEventListener('change',()=>localStorage.setItem('pmfeed_'+id,$(id).value));}
function number(v){return Number(v)}
function normalize(t){const price=number(t.price??t.trade_price);const amount=number(t.amount??t.usd_amount??(number(t.size)*price));return {time:t.time??t.timestamp??t.created_at,platform:String(t.platform??'Polymarket'),event:String(t.event??t.title??t.market??t.slug??t.conditionId??'Unknown event'),side:String(t.side??t.outcome??'Unknown'),price,amount};}
function safeTime(v){if(v===undefined||v===null)return 'Unknown';const n=Number(v);const d=new Date(Number.isFinite(n)&&String(v).trim()!==''?(n<1e11?n*1000:n):v);return Number.isNaN(d.getTime())?'Unknown':d.toLocaleString();}
function render(rows){const body=$('results');body.replaceChildren();if(!rows.length){const tr=body.insertRow();const td=tr.insertCell();td.colSpan=6;td.textContent='No trades match your filters.';return;}for(const t of rows){const tr=body.insertRow();for(const value of [safeTime(t.time),t.platform,t.event,t.side,Number.isFinite(t.price)?'$'+t.price.toFixed(2):'—',Number.isFinite(t.amount)?'$'+t.amount.toLocaleString(undefined,{maximumFractionDigits:2}):'—'])tr.insertCell().textContent=value;}}
async function refresh(){const endpoint=$('api').value.trim();if(!/^https:\/\//i.test(endpoint)){$('status').textContent='Enter your HTTPS Cloudflare Worker API URL first.';return;}const min=number($('minPrice').value),max=number($('maxPrice').value);if(min<0||max>1||min>max){$('status').textContent='Check price range: minimum must be no greater than maximum (0–1).';return;}$('status').textContent='Loading…';try{const response=await fetch(endpoint,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('API HTTP '+response.status);const data=await response.json();if(data.error)throw Error(data.error);const raw=Array.isArray(data)?data:Array.isArray(data.trades)?data.trades:[];let rows=raw.map(normalize).filter(t=>Number.isFinite(t.price)&&t.price>=min&&t.price<=max&&Number.isFinite(t.amount)&&t.amount>=number($('minAmount').value)&&(!$('maxAmount').value||t.amount<=number($('maxAmount').value))&&($('platform').value==='all'||t.platform.toLowerCase()===$('platform').value)&&($('side').value==='all'||t.side.toLowerCase()===$('side').value));rows.sort((a,b)=>$('group').value==='event'?a.event.localeCompare(b.event):new Date(b.time).getTime()-new Date(a.time).getTime());render(rows);$('status').textContent='Showing '+rows.length+' of '+raw.length+' trades returned by API. Refresh manually for updates.';}catch(e){render([]);$('status').textContent='Could not load trades: '+e.message+'\nCheck the Worker URL, deployment and CORS settings.';}}
$('refresh').addEventListener('click',refresh);
</script></body></html>O
